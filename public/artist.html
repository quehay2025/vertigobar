<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050506" />
<title>VÉRTIGO BAR — Artista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="artist.css" />
</head>
<body class="hud-grid">

<!-- Acceso -->
<section id="gate" class="gate">
  <div class="brand"><span class="b1">VÉRTIGO</span><span class="b2">·ARTISTA</span></div>
  <p class="gate-lead">Ingresa con tu código personal de artista</p>
  <form id="keyForm" class="gate-form" autocomplete="off">
    <input id="keyInput" type="text" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos" />
    <button class="btn" type="submit">ENTRAR ▸</button>
  </form>
  <p id="gateMsg" class="gate-msg"></p>
</section>

<!-- Panel -->
<section id="panel" class="panel">
  <header class="a-head">
    <div class="brand small"><span class="b1">VÉRTIGO</span><span class="b2">·ARTISTA</span></div>
    <div class="a-artist" id="artistBadge">—</div>
  </header>

  <!-- En vivo ahora -->
  <div id="liveSection" style="display:none;">
    <div class="a-hint" id="liveHint"></div>
    <h3 class="a-section">EN VOTACIÓN <span id="activeCount" class="tag">0</span></h3>
    <div id="ranking" class="ranking"><!-- filas activas --></div>

    <details class="a-more" open>
      <summary><span id="doneLabel">Ya cumplidos</span> <span id="doneCount" class="tag">0</span></summary>
      <div id="donelist" class="donelist"><!-- filas cumplidas --></div>
    </details>
  </div>
  <div id="notLiveMsg" class="a-hint" style="display:none;"></div>

  <!-- Repertorio persistente -->
  <h3 class="a-section">MI REPERTORIO <span id="repCount" class="tag">0</span></h3>
  <div id="repList" class="ranking"><!-- items del repertorio --></div>

  <details class="a-more" open>
    <summary id="addSummary">➕ Agregar</summary>
    <form id="addForm" class="add-form" autocomplete="off">
      <div id="addFields" class="field-grid"><!-- inputs dinámicos --></div>
      <button class="btn ghost" type="submit">Agregar</button>
    </form>
  </details>

  <p id="msg" class="a-msg"></p>
  <div class="a-links">
    <a href="/tv" target="_blank">▸ Pantalla TV</a>
    <a href="/vota" target="_blank">▸ Vista cliente</a>
    <a href="#" id="logoutLink">↺ Salir</a>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="categories.js"></script>
<script src="errors.js"></script>
<script src="artist.js"></script>
</body>
</html>
