<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tribu Gastro Pub — Pantalla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tv2.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="band" width="32" height="44" patternUnits="userSpaceOnUse">
 <rect width="32" height="44" fill="#1a0c07"/>
 <path d="M2 4H14L8 17Z" fill="#c98a3a"/><path d="M18 4H30L24 17Z" fill="#7a4d1f"/>
 <path d="M0 40H16V27H32V40" fill="none" stroke="#e08a2b" stroke-width="3"/>
 <rect x="20" y="31" width="5" height="5" transform="rotate(45 22.5 33.5)" fill="#c98a3a"/>
</pattern></defs></svg>

<div id="stage">
 <div id="stone"></div>
 <div class="band" id="bandT"><svg><rect width="100%" height="100%" fill="url(#band)"/></svg></div>
 <div class="band" id="bandB"><svg><rect width="100%" height="100%" fill="url(#band)"/></svg></div>

 <div id="content">
 <svg id="sun1" viewBox="-560 -560 1120 1120"></svg>
 <svg id="sun2" viewBox="-560 -560 1120 1120"></svg>
 <div id="head">
  <img id="logo" alt="TRIBU Gastro Pub" src="/img/logo.png">
  <div id="ttl" class="fire-text">EL LLAMADO DE LA TRIBU</div>
  <div id="sub">Cada voz enciende la hoguera · vota desde tu mesa</div>
  <div id="tot"><small>VOCES</small><b class="fire-text" id="totn">0</b></div>
 </div>

 <div id="rows"></div>
 <div id="empty"><b class="fire-text">LA TRIBU SE REÚNE</b><span id="emptySub">Esperando el próximo show…</span></div>
 <div id="tick"></div>

 <div id="panel">
  <div class="pb t"><svg width="100%" height="44"><rect width="100%" height="100%" fill="url(#band)"/></svg></div>
  <h2 class="fire-text">ÚNETE A<br>LA TRIBU</h2>
  <p id="sideSub">Escanea y vota lo que sigue</p>
  <div id="qrw">
   <div class="glow"></div>
   <svg viewBox="-170 -170 340 340" id="ring"></svg>
   <div id="qr"></div>
  </div>
  <div class="lab">EN VIVO AHORA</div>
  <div class="val"><span class="live"></span><span id="liveArtist">—</span></div>
  <div class="lab" style="margin-top:18px">PRÓXIMO SHOW</div>
  <div class="val" id="nextLabel" style="font-size:34px">—</div>
  <div id="cd"></div>
  <div class="pb b"><svg width="100%" height="44"><rect width="100%" height="100%" fill="url(#band)"/></svg></div>
 </div>

 <div id="credit">© 2026 Desarrollado por <b>QUEHAY LABS SAS</b></div>
 </div>

 <canvas id="fx"></canvas>
 <div id="celeBg"></div>
 <div id="pum"><div class="p1 fire-text" id="pumT">¡PUM!</div><div class="p2" id="pumA"></div><div class="p3" id="pumB"></div></div>
 <div id="celeTx">
  <svg class="cb"><rect width="100%" height="100%" fill="url(#band)"/></svg>
  <div class="c1 fire-text">LA TRIBU HA HABLADO</div>
  <div class="cl">AHORA ESCUCHA</div>
  <div class="c2" id="cName">—</div>
  <div class="cs" id="cSub"></div>
  <div class="c3" id="cVotes">0 VOCES</div>
  <svg class="cb"><rect width="100%" height="100%" fill="url(#band)"/></svg>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="categories.js"></script>
<script src="tv2.js"></script>
</body>
</html>
