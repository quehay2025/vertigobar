<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0B" />
<title>VÉRTIGO Gastro Pub — Próximamente</title>
<meta name="description" content="VÉRTIGO Gastro Pub. Muy pronto." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css" />
</head>
<body>

<!-- El local, detrás del telón -->
<div class="layer" id="bgLocal"></div>
<div class="layer" id="glow"></div>

<!-- Telón -->
<div class="layer curtain" id="curtain" aria-hidden="true">
  <div class="panel left"  id="panelL"></div>
  <div class="panel right" id="panelR"></div>
  <div class="valance"></div>
</div>
<div class="layer" id="scrim"></div>
<div class="layer" id="vignette"></div>

<!-- Logo + cartel -->
<main class="stage">
  <img id="logo" src="img/logo.png" alt="VÉRTIGO Gastro Pub" />
  <div class="logo-fallback" id="logoFallback" hidden>
    VÉRTIGO<small>Gastro Pub</small>
  </div>

  <div class="sign-rig" id="signRig">
    <div class="cords"><span></span><span></span></div>
    <div class="sign">
      <h1>Próximamente</h1>
      <p>Muy pronto en la ciudad</p>
    </div>
  </div>
</main>

<footer class="foot">
  <a href="/arcade">Zona Arcade</a>
</footer>

<script src="home.js"></script>
</body>
</html>
