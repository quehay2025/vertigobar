<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VÉRTIGO BAR — Control</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css" />
<style>
  .adm { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-family: var(--font-mono); font-size: 1.6rem; margin-bottom: 4px; }
  h1 .b2 { color: var(--orange); text-shadow: var(--glow-orange); }
  .sub { color: var(--text-dim); margin-bottom: 22px; font-size: .9rem; }
  .card { background: var(--grad-panel); border: 1.5px solid var(--line); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 18px; }
  .card h2 { font-family: var(--font-mono); font-size: 1rem; color: var(--orange); margin-bottom: 14px; letter-spacing: 1px; }
  label { display: block; font-size: .78rem; color: var(--text-dim); margin: 10px 0 4px; letter-spacing: 1px; }
  input, select { width: 100%; background: var(--bg-2); border: 1.5px solid var(--line); border-radius: 10px; color: var(--white); padding: 11px 13px; font-family: var(--font); font-size: 1rem; outline: none; }
  input:focus, select:focus { border-color: var(--orange); box-shadow: var(--glow-orange); }
  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn.ghost { background: transparent; border: 1.5px solid var(--line); box-shadow: none; color: var(--text); }
  .btn.danger { background: linear-gradient(135deg, #ff3b3b, #a30000); box-shadow: 0 0 18px rgba(255,59,59,.4); }
  .btn.small { padding: 7px 12px; font-size: .78rem; }
  .status { font-size: .85rem; color: var(--text-dim); margin-top: 10px; min-height: 18px; }
  .status.ok { color: var(--neon); } .status.err { color: #ff5a5a; }
  .live-state { font-family: var(--font-mono); font-size: .85rem; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-family: var(--font-mono); }
  .pill.open { background: var(--grad-brand); color: #fff; }
  .pill.closed { background: #333; color: var(--text-dim); }
  .pill.cat { background: var(--bg-2); border: 1px solid var(--line); color: var(--text-dim); }
  .links a { color: var(--neon); text-decoration: none; margin-right: 16px; font-size: .85rem; }

  .code-reveal { display: none; margin-top: 14px; padding: 14px; border-radius: 12px; border: 1.5px solid var(--orange); background: rgba(255,106,0,.08); }
  .code-reveal.on { display: block; }
  .code-reveal .lbl { font-size: .75rem; color: var(--text-dim); letter-spacing: 1px; }
  .code-reveal .code { font-family: var(--font-mono); font-size: 2rem; letter-spacing: 4px; color: var(--orange); text-shadow: var(--glow-orange); }
  .code-reveal .name { font-size: .85rem; color: var(--text-dim); margin-top: 4px; }

  .artist-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .artist-row:last-child { border-bottom: none; }
  .artist-row .info { flex: 1; min-width: 140px; }
  .artist-row .aname { font-weight: 600; }
  .artist-row .ameta { font-size: .75rem; color: var(--text-dim); }
  .artist-row .acode { font-family: var(--font-mono); letter-spacing: 2px; color: var(--neon); }
  .empty { color: var(--text-dim); font-size: .85rem; padding: 8px 0; }

  .ns-mode { display: flex; gap: 18px; margin: 10px 2px 4px; }
  .ns-radio { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--text); width: auto; margin: 0; }
  .ns-radio input { width: auto; padding: 0; }
</style>
</head>
<body class="hud-grid">
<div class="adm">
  <h1><span class="b1">VÉRTIGO</span><span class="b2">·CONTROL</span></h1>
  <div class="sub">Panel de operador · artistas y votación</div>
  <div class="links">
    <a href="/vota" target="_blank">▸ Vista cliente</a>
    <a href="/tv" target="_blank">▸ Pantalla TV</a>
  </div>

  <div class="card">
    <h2>ESTADO ACTUAL</h2>
    <div class="live-state" id="live">Cargando…</div>
  </div>

  <div class="card">
    <h2>CLAVE DE OPERADOR</h2>
    <input id="key" type="password" placeholder="ADMIN_KEY" />
  </div>

  <div class="card">
    <h2>ARTISTAS</h2>
    <label>Nombre</label>
    <input id="artistName" placeholder="Ej: Los Vértigos" />
    <label>Categoría</label>
    <select id="artistCategory"></select>
    <div class="row-actions">
      <button class="btn" id="createArtistBtn">➕ Crear artista</button>
      <button class="btn ghost" id="refreshArtistsBtn">🔄 Actualizar lista</button>
    </div>
    <div class="code-reveal" id="codeReveal">
      <div class="lbl">CÓDIGO DE ACCESO — entrégaselo al artista</div>
      <div class="code" id="codeRevealValue">——————</div>
      <div class="name" id="codeRevealName"></div>
    </div>
    <div class="status" id="artistStatus"></div>
    <div id="artistList" style="margin-top:14px;"></div>
  </div>

  <div class="card">
    <h2>INICIAR RONDA</h2>
    <label>Artista en vivo</label>
    <select id="roundArtist"><option value="">— Selecciona un artista —</option></select>
    <label>Título de la ronda</label>
    <input id="title" placeholder="Se autocompleta según la categoría" />
    <div class="row-actions">
      <button class="btn" id="openBtn">▸ ABRIR RONDA</button>
      <button class="btn ghost" id="resetBtn">↺ Reiniciar votos</button>
      <button class="btn danger" id="closeBtn">■ CERRAR (K.O.)</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h2>PRÓXIMO SHOW</h2>
    <label>¿Quién / qué sigue?</label>
    <input id="nsLabel" placeholder="Ej: DJ Tech-Mix Live" />
    <label>¿Cuándo empieza?</label>
    <div class="ns-mode">
      <label class="ns-radio"><input type="radio" name="nsMode" value="hora" checked> Hora exacta</label>
      <label class="ns-radio"><input type="radio" name="nsMode" value="duracion"> En cuánto tiempo</label>
    </div>
    <input id="nsHora" type="time" />
    <input id="nsMinutos" type="number" min="1" placeholder="Minutos desde ahora" style="display:none;" />
    <div class="row-actions">
      <button class="btn" id="nsSetBtn">▸ Actualizar</button>
      <button class="btn ghost" id="nsDelay10Btn">+10 min (retraso)</button>
      <button class="btn ghost" id="nsDelay30Btn">+30 min</button>
      <button class="btn danger" id="nsClearBtn">✕ Quitar</button>
    </div>
    <div class="status" id="nsStatus"></div>
    <div class="live-state" id="nsLive" style="margin-top:8px;"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="categories.js"></script>
<script src="errors.js"></script>
<script>
const socket = io();
const $ = s => document.querySelector(s);

let artistsCache = [];

// ---- Clave de operador (persistida en esta pestaña) ----
const savedKey = sessionStorage.getItem('vertigo_admin_key') || '';
if (savedKey) $('#key').value = savedKey;
$('#key').addEventListener('change', () => sessionStorage.setItem('vertigo_admin_key', key()));
function key() { return $('#key').value.trim(); }

// ---- Selector de categoría ----
const catSelect = $('#artistCategory');
window.VERTIGO_CATEGORY_LIST.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c.id; opt.textContent = `${c.icon} ${c.label}`;
  catSelect.appendChild(opt);
});

function setStatus(el, msg, cls = '') { const s = $(el); s.textContent = msg; s.className = 'status ' + cls; }

// ---- Crear artista ----
$('#createArtistBtn').onclick = () => {
  const name = $('#artistName').value.trim();
  const category = catSelect.value;
  if (!name) return setStatus('#artistStatus', 'Escribe un nombre', 'err');
  socket.emit('admin_crear_artista', { key: key(), name, category }, res => {
    if (res?.ok) {
      $('#artistName').value = '';
      setStatus('#artistStatus', 'Artista creado ✓', 'ok');
      $('#codeReveal').classList.add('on');
      $('#codeRevealValue').textContent = res.artist.code;
      $('#codeRevealName').textContent = `${res.artist.name} · ${window.vertigoCategory(res.artist.category).label}`;
      loadArtists();
    } else {
      setStatus('#artistStatus', 'Error: ' + window.vertigoError(res?.error), 'err');
    }
  });
};

// ---- Listar artistas ----
$('#refreshArtistsBtn').onclick = loadArtists;
function loadArtists() {
  socket.emit('admin_listar_artistas', { key: key() }, res => {
    if (!res?.ok) { setStatus('#artistStatus', 'Error: ' + window.vertigoError(res?.error), 'err'); return; }
    artistsCache = res.artists;
    renderArtistList();
    renderRoundArtistSelect();
  });
}

function renderArtistList() {
  const box = $('#artistList');
  if (!artistsCache.length) { box.innerHTML = '<div class="empty">Todavía no hay artistas creados.</div>'; return; }
  box.innerHTML = '';
  artistsCache.forEach(a => {
    const cat = window.vertigoCategory(a.category);
    const row = document.createElement('div');
    row.className = 'artist-row';
    row.innerHTML = `
      <div class="info">
        <div class="aname">${cat.icon} ${esc(a.name)}</div>
        <div class="ameta"><span class="pill cat">${cat.label}</span> · ${a.repertoireCount} ${cat.itemLabelPlural.toLowerCase()} · código <span class="acode">${a.code}</span></div>
      </div>
      <button class="btn ghost small" data-act="regen">↺ Código</button>
      <button class="btn danger small" data-act="del">✕ Borrar</button>`;
    row.querySelector('[data-act="regen"]').onclick = () => {
      if (!confirm(`¿Generar un código nuevo para ${a.name}? El código anterior dejará de funcionar.`)) return;
      socket.emit('admin_regenerar_codigo_artista', { key: key(), artistId: a.id }, res => {
        if (res?.ok) {
          $('#codeReveal').classList.add('on');
          $('#codeRevealValue').textContent = res.artist.code;
          $('#codeRevealName').textContent = `${res.artist.name} · ${cat.label}`;
          loadArtists();
        } else setStatus('#artistStatus', 'Error: ' + window.vertigoError(res?.error), 'err');
      });
    };
    row.querySelector('[data-act="del"]').onclick = () => {
      if (!confirm(`¿Eliminar a ${a.name} y su repertorio? Esto no se puede deshacer.`)) return;
      socket.emit('admin_eliminar_artista', { key: key(), artistId: a.id }, res => {
        if (res?.ok) loadArtists(); else setStatus('#artistStatus', 'Error: ' + window.vertigoError(res?.error), 'err');
      });
    };
    box.appendChild(row);
  });
}

function renderRoundArtistSelect() {
  const sel = $('#roundArtist');
  const current = sel.value;
  sel.innerHTML = '<option value="">— Selecciona un artista —</option>';
  artistsCache.forEach(a => {
    const cat = window.vertigoCategory(a.category);
    const opt = document.createElement('option');
    opt.value = a.id;
    opt.textContent = `${cat.icon} ${a.name} (${cat.label}) · ${a.repertoireCount} ${cat.itemLabelPlural.toLowerCase()}`;
    sel.appendChild(opt);
  });
  if ([...sel.options].some(o => o.value === current)) sel.value = current;
}

$('#roundArtist').addEventListener('change', () => {
  const a = artistsCache.find(x => x.id === $('#roundArtist').value);
  if (a && !$('#title').value) $('#title').placeholder = window.vertigoCategory(a.category).promptLabel;
});

// ---- Ronda ----
$('#openBtn').onclick = () => {
  const artistId = $('#roundArtist').value;
  if (!artistId) return setStatus('#status', 'Elige un artista primero', 'err');
  socket.emit('admin_iniciar_ronda_artista', {
    key: key(), artistId, title: $('#title').value.trim()
  }, res => res?.ok ? setStatus('#status', 'Ronda abierta ✓', 'ok') : setStatus('#status', 'Error: ' + window.vertigoError(res?.error), 'err'));
};
$('#closeBtn').onclick = () => {
  socket.emit('admin_cerrar_ronda', { key: key() },
    res => res?.ok ? setStatus('#status', 'Ronda cerrada · ganador definido ✓', 'ok') : setStatus('#status', 'Error: ' + window.vertigoError(res?.error), 'err'));
};
$('#resetBtn').onclick = () => {
  socket.emit('admin_reset', { key: key() },
    res => res?.ok ? setStatus('#status', 'Votos reiniciados ✓', 'ok') : setStatus('#status', 'Error: ' + window.vertigoError(res?.error), 'err'));
};

function renderLive(s) {
  if (!s) { $('#live').textContent = 'Sin ronda activa'; return; }
  const cat = window.vertigoCategory(s.category);
  const pill = s.open ? '<span class="pill open">ABIERTA</span>' : '<span class="pill closed">CERRADA</span>';
  const rows = s.items.map(x => {
    const sub = [x.artist, x.genre].filter(Boolean).join(' · ');
    return `${x.rank}. ${esc(x.title)}${sub ? ' — <i>' + esc(sub) + '</i>' : ''} — <b style="color:var(--orange)">${x.votes}</b> (${x.pct}%)`;
  }).join('<br>');
  $('#live').innerHTML = `${pill} <span class="pill cat">${cat.icon} ${s.artistName || '—'}</span> &nbsp; total: <b>${s.total}</b><br><br>${rows || '<span class="empty">Sin ' + cat.itemLabelPlural.toLowerCase() + ' en votación.</span>'}`;
}
socket.on('estado_actual', renderLive);
socket.on('voto_recibido', ({ state }) => renderLive(state));
socket.on('ronda_concluida', ({ state }) => renderLive(state));
socket.on('rebase_ocurrido', ({ state }) => renderLive(state));
socket.on('ronda_iniciada', renderLive);

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---- Próximo show (cuenta regresiva) ----
let nextShowInfo = null;
let nsTickInterval = null;

document.querySelectorAll('input[name="nsMode"]').forEach(r => {
  r.addEventListener('change', () => {
    const isHora = $('input[name="nsMode"]:checked').value === 'hora';
    $('#nsHora').style.display = isHora ? '' : 'none';
    $('#nsMinutos').style.display = isHora ? 'none' : '';
  });
});

$('#nsSetBtn').onclick = () => {
  const label = $('#nsLabel').value.trim();
  if (!label) return setStatus('#nsStatus', 'Escribe quién/qué sigue', 'err');
  const mode = $('input[name="nsMode"]:checked').value;
  const value = mode === 'hora' ? $('#nsHora').value : $('#nsMinutos').value;
  socket.emit('admin_set_next_show', { key: key(), label, mode, value }, res => {
    res?.ok ? setStatus('#nsStatus', 'Próximo show actualizado ✓', 'ok') : setStatus('#nsStatus', 'Error: ' + window.vertigoError(res?.error), 'err');
  });
};
$('#nsDelay10Btn').onclick = () => {
  socket.emit('admin_posponer_next_show', { key: key(), minutes: 10 },
    res => res?.ok ? setStatus('#nsStatus', '+10 min aplicados ✓', 'ok') : setStatus('#nsStatus', 'Error: ' + window.vertigoError(res?.error), 'err'));
};
$('#nsDelay30Btn').onclick = () => {
  socket.emit('admin_posponer_next_show', { key: key(), minutes: 30 },
    res => res?.ok ? setStatus('#nsStatus', '+30 min aplicados ✓', 'ok') : setStatus('#nsStatus', 'Error: ' + window.vertigoError(res?.error), 'err'));
};
$('#nsClearBtn').onclick = () => {
  socket.emit('admin_borrar_next_show', { key: key() },
    res => res?.ok ? setStatus('#nsStatus', 'Próximo show quitado', 'ok') : setStatus('#nsStatus', 'Error: ' + window.vertigoError(res?.error), 'err'));
};

function renderNsLive() {
  clearInterval(nsTickInterval);
  const el = $('#nsLive');
  if (!nextShowInfo) { el.textContent = 'Sin próximo show definido.'; return; }
  if (!nextShowInfo.targetAt) { el.textContent = `📣 ${nextShowInfo.label} (sin horario)`; return; }
  const tick = () => {
    const remaining = nextShowInfo.targetAt - Date.now();
    if (remaining <= 0) { el.innerHTML = `📣 ${esc(nextShowInfo.label)} — <b style="color:var(--orange)">¡ya casi!</b>`; return; }
    const h = Math.floor(remaining / 3600000), m = Math.floor((remaining % 3600000) / 60000), s = Math.floor((remaining % 60000) / 1000);
    const hh = h > 0 ? h + ':' : '';
    el.innerHTML = `📣 ${esc(nextShowInfo.label)} — <b style="color:var(--orange)">${hh}${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}</b>`;
  };
  tick();
  nsTickInterval = setInterval(tick, 1000);
}
socket.on('proximo_show_actualizado', info => { nextShowInfo = info; renderNsLive(); });

if (savedKey) loadArtists();
</script>
</body>
</html>
