# Despliegue en Render — dos servicios, separados por lo que cada uno necesita.
#
#   vertigo-landing : el "Proximamente". Archivos estaticos, sin servidor.
#                     No se apaga nunca: carga al instante siempre.
#                     -> dominio raiz  vertigogastropub.com
#
#   vertigo-bar     : la votacion en vivo. Necesita Node, WebSockets y Mongo,
#                     asi que sigue en el plan free y duerme tras 15 min sin
#                     trafico. Eso solo lo nota quien entra a votar.
#                     -> subdominio    arcade.vertigogastropub.com
#
# Los enlaces y QR viejos que apunten al dominio raiz (/vota, /tv, /admin...)
# se redirigen al subdominio desde dist/_redirects, que genera el build.
services:
  - type: web
    name: vertigo-landing
    runtime: static
    buildCommand: npm run build:landing
    staticPublishPath: ./dist

  - type: web
    name: vertigo-bar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_KEY
        sync: false          # define tu clave en el dashboard
      - key: MONGODB_URI
        sync: false          # pega tu cadena de MongoDB Atlas (opcional)
